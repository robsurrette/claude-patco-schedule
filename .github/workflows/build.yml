name: Build

on:
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcpretty
        run: gem install xcpretty

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project PATCOSchedule.xcodeproj \
            -scheme PATCOSchedule \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
