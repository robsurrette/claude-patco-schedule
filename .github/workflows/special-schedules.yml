# Update the special-schedules feed on a cron.
#
# Scrapes RidePATCO.org for special-schedule PDFs, parses them with the shared
# timetable parser, and publishes specials.json (+ state.json + the baseline
# schedule.json) to the orphan `feed` branch, which GitHub Pages serves at
#   https://robsurrette.github.io/claude-patco-schedule/specials.json
# (Pages must be enabled once: Settings -> Pages -> deploy from `feed`, root.)
#
# Per-PDF parse failures degrade to alert-only entries (surfaced as ::warning
# annotations); the job only fails when no source page is reachable, which
# emails the repo owner via Actions' failure notification.
name: Update special schedules feed

on:
  schedule:
    - cron: "23 */6 * * *" # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: special-schedules-feed
  cancel-in-progress: false

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pdfplumber

      - name: Restore previous feed state
        run: |
          if git fetch origin feed --depth 1 2>/dev/null; then
            git show FETCH_HEAD:state.json > previous-state.json || echo '{}' > previous-state.json
            git show FETCH_HEAD:specials.json > previous-specials.json || echo '{}' > previous-specials.json
          else
            echo '{}' > previous-state.json
            echo '{}' > previous-specials.json
          fi

      - name: Build feed
        run: python3 tools/update_specials.py --out-dir feed-out --state previous-state.json

      - name: Publish to feed branch (if changed)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Ignore the always-changing generatedAt timestamp when deciding
          # whether anything real changed.
          if [ "$(jq -S 'del(.generatedAt)' feed-out/specials.json)" = "$(jq -S 'del(.generatedAt)' previous-specials.json 2>/dev/null)" ]; then
            echo "No feed changes; skipping publish."
            exit 0
          fi
          cd feed-out
          git init -q -b feed
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "Update special-schedules feed ($(date -u +%FT%TZ))"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" feed
