name: iOS Build

on:
  push:
    branches: ["claude/**", "main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (iOS Simulator)
    # macos-15 ships Xcode 16, required for this project's objectVersion 77
    # (file-system synchronized groups).
    runs-on: macos-15
    env:
      SCHEME: PATCOSchedule
      PROJECT: PATCOSchedule.xcodeproj
      SIMULATOR: iPhone 16

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -i "iPhone 16" || true

      - name: Build for Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=$SIMULATOR" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify || xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=$SIMULATOR" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO
