name: iOS Build

on:
  push:
    branches: ["claude/**", "main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (iOS Simulator)
    # macos-15 ships Xcode 16, required for this project's objectVersion 77
    # (file-system synchronized groups).
    runs-on: macos-15
    env:
      SCHEME: PATCOSchedule
      PROJECT: PATCOSchedule.xcodeproj
      SIMULATOR: iPhone 16
      BUNDLE_ID: com.robsurrette.PatcoTrainSchedule

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -i "iPhone 16" || true

      - name: Build for Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=$SIMULATOR" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify || xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=$SIMULATOR" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      # The steps below are best-effort: a green build above is the real gate.
      - name: Boot simulator, install & screenshot
        continue-on-error: true
        run: |
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          echo "App: $APP"
          xcrun simctl boot "$SIMULATOR" || true
          xcrun simctl bootstatus "$SIMULATOR" -b || true
          xcrun simctl install booted "$APP"
          xcrun simctl launch booted "$BUNDLE_ID" || true
          sleep 8
          xcrun simctl io booted screenshot screenshot.png

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshot
          path: screenshot.png
          if-no-files-found: ignore

      # Commit the screenshot back to the branch so it can be referenced in the
      # PR description / docs. Guarded with [skip ci] so it doesn't loop.
      - name: Commit screenshot to repo (branch builds only)
        if: success() && startsWith(github.ref, 'refs/heads/claude/')
        run: |
          [ -f screenshot.png ] || { echo "no screenshot, skipping"; exit 0; }
          mkdir -p docs/screenshots
          cp screenshot.png docs/screenshots/home-tab.png
          git config user.email "noreply@anthropic.com"
          git config user.name "Claude"
          git add docs/screenshots/home-tab.png
          if git diff --cached --quiet; then
            echo "screenshot unchanged, nothing to commit"; exit 0
          fi
          git commit -m "CI: update home-tab simulator screenshot [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
